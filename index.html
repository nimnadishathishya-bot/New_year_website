<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinhala New Year</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a0800;
    }

    .page {
      background: #695ec5;
      border: 6px solid #886dde;
      outline: 2px solid #184ba9;
      outline-offset: -10px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      min-height: 600px;
      width: 100%;
      max-width: 520px;
      margin: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .border-top, .border-bottom {
      width: 100%;
      height: 28px;
      background: #097de3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .border-unit {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #097de3;
      font-size: 14px;
    }

    .inner {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 20px 24px;
      position: relative;
    }

    .side-border-left, .side-border-right {
      position: absolute;
      top: 0; bottom: 0;
      width: 28px;
      background: #097de3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .side-border-left { left: 0; }
    .side-border-right { right: 0; }

    .side-unit {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: #090909; font-size: 13px;
    }

    .content {
      margin: 0 34px;
      width: calc(100% - 68px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .divider-line {
      width: 90%; height: 1.5px;
      background: #0b0b0b;
      margin: 10px 0;
      position: relative;
    }
    .divider-line::before, .divider-line::after {
      content: '';
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 7px; height: 7px;
      background: #d4a017; border-radius: 50%;
    }
    .divider-line::before { left: -4px; }
    .divider-line::after  { right: -4px; }

    .lamp-row, .lotus-row, .bottom-motif {
      display: flex; justify-content: center; gap: 14px; margin: 6px 0;
    }

    .year-label {
      font-family: 'Libre Baskerville', serif;
      font-size: 11px; color: #d4a017;
      letter-spacing: 5px; text-transform: uppercase;
      margin-top: 4px; opacity: 0.85;
    }

    .main-title {
      font-family: 'Libre Baskerville', serif;
      font-size: 13px; color: #f0c040;
      letter-spacing: 4px; text-transform: uppercase;
      margin: 2px 0 6px;
    }

    .sinhala-title {
      font-family: 'Noto Serif Sinhala', serif;
      font-size: 22px; color: #f5e6b0;
      font-weight: 700; text-align: center;
      line-height: 1.5; margin-bottom: 2px;
    }

    .trad-btn {
      background: #8b4a00; color: #f5e6b0;
      border: 2px solid #d4a017; border-radius: 0;
      padding: 10px 36px;
      font-family: 'Libre Baskerville', serif;
      font-size: 14px; letter-spacing: 2px;
      cursor: pointer; text-transform: uppercase;
      transition: background 0.18s, color 0.18s;
      position: relative; margin: 14px 0 8px;
    }
    .trad-btn::before, .trad-btn::after {
      content: '✦'; position: absolute;
      top: 50%; transform: translateY(-50%);
      color: #d4a017; font-size: 10px;
    }
    .trad-btn::before { left: 10px; }
    .trad-btn::after  { right: 10px; }
    .trad-btn:hover { background: #d4a017; color: #2d1200; }

    .wish-area {
      min-height: 80px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
    }

    .wish-en {
      font-family: 'Libre Baskerville', serif;
      font-size: 22px; color: #f5e6b0;
      letter-spacing: 3px; text-transform: uppercase;
      animation: fadeUp 0.6s cubic-bezier(.36,1.5,.6,1) both;
    }
    .wish-si {
      font-family: 'Noto Serif Sinhala', serif;
      font-size: 16px; color: #d4a017;
      animation: fadeUp 0.6s 0.15s cubic-bezier(.36,1.5,.6,1) both;
    }

    @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .confetti-wrap {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
    }
    .cp {
      position: absolute; width: 6px; height: 6px;
      opacity: 0; animation: cffall 1.8s ease-in forwards;
    }
    @keyframes cffall {
      0%   { opacity: 1; transform: translateY(-10px) rotate(0deg); }
      100% { opacity: 0; transform: translateY(650px) rotate(600deg); }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="border-top" id="topBorder"></div>
  <div class="inner">
    <div class="side-border-left" id="leftBorder"></div>
    <div class="side-border-right" id="rightBorder"></div>
    <div class="content">
      <div class="year-label"><b>Sinhala and Tamil New Year 2026</b></div>
      <div class="divider-line"></div>
      <div class="lamp-row" id="lampRow"></div>
      <div class="divider-line"></div>
      <div class="lotus-row" id="lotusRow"></div>
      <div class="main-title">Sinhala New Year</div>
      <div class="sinhala-title">සිංහල අලුත් අවුරුදු</div>
      <div class="divider-line"></div>
      <button class="trad-btn" onclick="showWish()">Click Me</button>
      <div class="wish-area" id="wishArea"></div>
      <div class="divider-line"></div>
      <div class="bottom-motif" id="bottomMotif"></div>
    </div>
  </div>
  <div class="border-bottom" id="bottomBorder"></div>
  <div class="confetti-wrap" id="confetti"></div>
</div>

<script>
  function makeLampSVG() {
    return `<svg width="32" height="54" viewBox="0 0 32 54">
      <ellipse cx="16" cy="34" rx="12" ry="5" fill="#8b4a00" stroke="#d4a017" stroke-width="1.2"/>
      <rect x="13" y="22" width="6" height="14" fill="#a05500"/>
      <ellipse cx="16" cy="22" rx="9" ry="4" fill="#c07020" stroke="#d4a017" stroke-width="1"/>
      <ellipse cx="16" cy="18" rx="5" ry="2.5" fill="#d4a017"/>
      <rect x="15" y="13" width="2" height="6" fill="#8b4a00"/>
      <ellipse cx="16" cy="12" rx="3" ry="2" fill="#ff9900" opacity="0.9"/>
      <path d="M14 12 Q16 4 18 12" fill="#ffdd44" opacity="0.95"/>
      <path d="M15 11 Q16 6 17 11" fill="#fff8aa" opacity="0.8"/>
    </svg>`;
  }

  function makeLotusSVG(color) {
    return `<svg width="36" height="30" viewBox="0 0 36 30">
      <ellipse cx="18" cy="20" rx="6" ry="4" fill="${color}" opacity="0.9"/>
      <path d="M18 18 Q10 10 8 2 Q14 10 18 14 Q22 10 28 2 Q26 10 18 18Z" fill="${color}" opacity="0.75"/>
      <path d="M18 18 Q6 14 2 8 Q10 14 18 16 Q26 14 34 8 Q30 14 18 18Z" fill="${color}" opacity="0.6"/>
      <circle cx="18" cy="20" r="3" fill="#f5e6b0" opacity="0.9"/>
    </svg>`;
  }

  function makeUnit(sym) {
    return `<div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#d4a017;font-size:14px;">${sym}</div>`;
  }

  const topB = document.getElementById('topBorder');
  const botB = document.getElementById('bottomBorder');
  for (let i = 0; i < 28; i++) {
    topB.innerHTML += makeUnit(i % 2 === 0 ? '✦' : '◆');
    botB.innerHTML += makeUnit(i % 2 === 0 ? '◆' : '✦');
  }

  const leftB = document.getElementById('leftBorder');
  const rightB = document.getElementById('rightBorder');
  for (let i = 0; i < 18; i++) {
    leftB.innerHTML  += makeUnit(i % 2 === 0 ? '✦' : '◆');
    rightB.innerHTML += makeUnit(i % 2 === 0 ? '◆' : '✦');
  }

  const lampRow = document.getElementById('lampRow');
  for (let i = 0; i < 5; i++) lampRow.innerHTML += makeLampSVG();

  const lotusRow = document.getElementById('lotusRow');
  ['#d4a017','#c0390d','#d4a017','#f0c040','#d4a017','#c0390d','#d4a017']
    .forEach(c => { lotusRow.innerHTML += makeLotusSVG(c); });

  const bottomMotif = document.getElementById('bottomMotif');
  for (let i = 0; i < 7; i++)
    bottomMotif.innerHTML += makeLotusSVG(i % 2 === 0 ? '#d4a017' : '#8b4a00');

  const cfColors = ['#d4a017','#f0c040','#c0390d','#f5e6b0','#8b4a00','#ffdd44'];

  function showWish() {
    document.getElementById('wishArea').innerHTML = `
      <div class="wish-en">Happy New Year</div>
      <div class="wish-si">සුභ අලුත් අවුරුද්දක් වේවා!</div>
    `;
    const wrap = document.getElementById('confetti');
    wrap.innerHTML = '';
    for (let i = 0; i < 55; i++) {
      const el = document.createElement('div');
      el.className = 'cp';
      el.style.left = Math.random() * 100 + '%';
      el.style.background = cfColors[Math.floor(Math.random() * cfColors.length)];
      el.style.animationDelay = (Math.random() * 1) + 's';
      el.style.animationDuration = (1.4 + Math.random() * 0.8) + 's';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
      wrap.appendChild(el);
    }
  }
</script>
</body>
</html>
